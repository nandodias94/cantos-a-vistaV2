
name: Cantos à Vista V2

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar motor de análise
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: python motor_analise.py
